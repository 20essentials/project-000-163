<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Srim</title>
    <meta name="google" content="notranslate" />
    <link rel="shortcut icon" href="assets/favicon.webp" type="image/x-icon" />
    <style>
      *,
      *::after,
      *::before {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans',
          'Helvetica Neue';
        -webkit-tap-highlight-color: transparent;
      }

      html {
        scroll-behavior: smooth;
        scrollbar-width: thin;
        scrollbar-color: white transparent;
      }

      body {
        height: 100dvh;
        display: flex;
        flex-wrap: wrap;
        place-content: center;
        background-image: radial-gradient(
          circle closest-corner,
          transparent 30%,
          #0f0a
        );
      }

      .container-rim {
        width: 400px;
        height: 300px;
        position: relative;

        @media (width <= 1000px) {
          transform: scale(0.5);
        }

        .column {
          position: absolute;
          left: calc(var(--l) * 11%);
          bottom: 0;
        }

        .rim {
          position: absolute;
          left: calc(var(--d) * 30px);
          left: 0;
          bottom: calc(var(--d) * 20px);
          transform: rotate(calc(-180deg * var(--d))) skew(25deg);
          width: 40px;
          height: 40px;
          background-color: #00f2;
          animation: changeColor 26s linear infinite both;
          animation-delay: calc(var(--d) * 0.1s);
        }
      }

      @keyframes changeColor {
        0% {
          background-color: #00f8;
          transform: rotate(calc(-180deg * (var(--d) + 45))) skew(25deg);
        }
        10% {
          background-color: #f008;
        }
        20% {
          background-color: #0f08;
        }
        30% {
          background-color: #08f8;
        }
        40% {
          background-color: #f80f;
        }
        50% {
          background-color: #80f8;
          transform: rotate(calc(0deg * (var(--d) + 45))) skew(25deg);
        }
        60% {
          background-color: #8f08;
        }
        70% {
          background-color: #0ff8;
        }
        80% {
          background-color: #ff08;
        }
        90% {
          background-color: #088f;
        }
        100% {
          background-color: #f808;
          transform: rotate(calc(180deg * (var(--d) + 45))) skew(25deg);
        }
      }
    </style>
  </head>
